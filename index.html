<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>วิธีใช้งานเครื่องล้าง</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .screen {
            width: 100vw;
            height: 100vh;

            aspect-ratio: 16 / 9;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .title {
            font-size: 4vw;
            font-weight: bold;
            margin-bottom: 4vh;
        }

        .step {
            font-size: 3vw;
            margin-bottom: 2vh;
        }

        .description {
            font-size: 2vw;
        }

        .content {
    width: 80vw;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.media {
    width: 70vw;
    height: 45vh;

    border: 3px solid #fff;
    border-radius: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 2vw;

    margin-bottom: 3vh;
}

.media img,
.media video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 12px;
}

    </style>
</head>

<body>

    <div class="screen">

    <div class="title">
        🚗 วิธีใช้งานเครื่องล้างรถ
    </div>

    <div class="content">

        <div class="media">
            📺
            <br>
            พื้นที่สำหรับวิดีโอ
        </div>

        <div class="step">
            ขั้นตอนที่ 1
        </div>

        <div class="description">
            💦 ฉีดน้ำให้ทั่วตัวรถก่อนเริ่มใช้งาน
        </div>

    </div>

</div>

<script>

    let step = 0;

    const steps = [
    {
        title: "💦 ฉีดน้ำ",
        description: "ฉีดน้ำให้ทั่วตัวรถก่อนเริ่มใช้งาน"
    },
    {
        title: "🫧 ฉีดโฟม",
        description: "ฉีดโฟมให้ทั่วตัวรถ"
    },
    {
        title: "💧 ล้างน้ำ",
        description: "ล้างโฟมออกให้สะอาด"
    },
    {
        title: "💨 เป่าลม",
        description: "เป่าลมไล่น้ำออกจากตัวรถ"
    },
    {
        title: "🧹 ดูดฝุ่น",
        description: "ดูดฝุ่นภายในรถ"
    }
];

    function showStep() {

    const current = steps[step];

    document.querySelector(".step").textContent =
        "ขั้นตอนที่ " + (step + 1) + " — " + current.title;

    document.querySelector(".description").textContent =
        current.description;

    const box = document.querySelector(".media");
    const number = String(step + 1).padStart(2, "0");

    const jpg = `media/${number}.jpg`;
    const mp4 = `media/${number}.mp4`;

    const video = document.createElement("video");

    video.src = mp4;
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;

    video.onloadeddata = function () {

        box.innerHTML = "";
        box.appendChild(video);

    };

    video.onerror = function () {

        const img = new Image();

        img.src = jpg;

        img.onload = function () {

            img.style.width = "100%";
            img.style.height = "100%";
            img.style.objectFit = "contain";

            box.innerHTML = "";
            box.appendChild(img);

        };

        img.onerror = function () {

            box.innerHTML = "ไม่มีไฟล์สำหรับขั้นตอนนี้";

        };

    };
}

    function nextStep() {

        step++;

        if (step >= steps.length) {
            step = 0;
        }

        showStep();
    }

    showStep();

    setInterval(nextStep, 10000);

</script>

</body>
</html>
